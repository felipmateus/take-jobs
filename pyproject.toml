[project]
name = "take-jobs"
version = "2.0.0"
description = "Coleta diária de vagas de emprego (vagas.com e Infojobs) exposta por uma API FastAPI."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic-settings",
    "scrapy",
    "apscheduler<4",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-socket",
    "httpx",
    "ruff",
    "import-linter",
    "testcontainers[postgres]",
    "pyyaml",
]

[project.scripts]
take-jobs = "take_jobs.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/take_jobs"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI usa Depends()/Query() como valor default por design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# Network guard (FR-30): only unix sockets and loopback are reachable. tests/conftest.py adds
# the testcontainers host to --allow-hosts when Docker is not on localhost.
addopts = "--disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,::1,localhost"
markers = [
    "integration: testes que sobem um PostgreSQL real via Docker (testcontainers)",
    "e2e: jornadas pela CLI e pela API contra PostgreSQL real e o servidor de fixtures",
    "perf: verificações de desempenho contra massa de dados grande",
]

[tool.coverage.run]
source = ["take_jobs"]
branch = true
omit = ["src/take_jobs/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

# Architectural Boundaries (_spec.md; ADR-001). The contracts below encode that table exactly.
[tool.importlinter]
root_package = "take_jobs"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain is pure Python (stdlib only)"
type = "forbidden"
source_modules = ["take_jobs.domain"]
forbidden_modules = [
    "take_jobs.application",
    "take_jobs.infrastructure",
    "take_jobs.api",
    "take_jobs.cli",
    "take_jobs.config",
    "fastapi",
    "sqlalchemy",
    "scrapy",
    "pydantic",
    "pydantic_settings",
    "parsel",
    "alembic",
    "asyncpg",
    "apscheduler",
    "uvicorn",
    "starlette",
    "twisted",
]

[[tool.importlinter.contracts]]
name = "application depends only on domain"
type = "forbidden"
source_modules = ["take_jobs.application"]
forbidden_modules = [
    "take_jobs.infrastructure",
    "take_jobs.api",
    "take_jobs.cli",
    "take_jobs.config",
    "fastapi",
    "sqlalchemy",
    "scrapy",
    "pydantic",
    "pydantic_settings",
    "parsel",
    "alembic",
    "asyncpg",
    "apscheduler",
    "uvicorn",
    "starlette",
    "twisted",
]

[[tool.importlinter.contracts]]
name = "infrastructure.db implements domain ports only"
type = "forbidden"
source_modules = ["take_jobs.infrastructure.db"]
forbidden_modules = [
    "take_jobs.application",
    "take_jobs.api",
    "take_jobs.cli",
    "take_jobs.config",
    "take_jobs.infrastructure.scraping",
]

[[tool.importlinter.contracts]]
name = "infrastructure.scraping never reaches the database or upper layers"
type = "forbidden"
source_modules = ["take_jobs.infrastructure.scraping"]
forbidden_modules = [
    "take_jobs.application",
    "take_jobs.api",
    "take_jobs.cli",
    "take_jobs.config",
    "take_jobs.infrastructure.db",
]

[[tool.importlinter.contracts]]
name = "api does not import cli"
type = "forbidden"
source_modules = ["take_jobs.api"]
forbidden_modules = ["take_jobs.cli"]

[[tool.importlinter.contracts]]
name = "api reaches infrastructure only from api.dependencies and api.app"
type = "forbidden"
source_modules = ["take_jobs.api"]
forbidden_modules = ["take_jobs.infrastructure"]
ignore_imports = [
    "take_jobs.api.dependencies -> take_jobs.infrastructure.**",
    "take_jobs.api.app -> take_jobs.infrastructure.**",
]

[[tool.importlinter.contracts]]
name = "cli does not import api"
type = "forbidden"
source_modules = ["take_jobs.cli"]
forbidden_modules = ["take_jobs.api"]

[[tool.importlinter.contracts]]
name = "config imports no other take_jobs package except domain"
type = "forbidden"
source_modules = ["take_jobs.config"]
forbidden_modules = [
    "take_jobs.application",
    "take_jobs.infrastructure",
    "take_jobs.api",
    "take_jobs.cli",
]
